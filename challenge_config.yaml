title: Longform Analogy Evaluation Challenge
short_description: An automated evaluation of computer science analogies and their video animations
description: templates/description.html
evaluation_details: templates/evaluation_details.html
terms_and_conditions: templates/terms_and_conditions.html
image: logo.jpg
submission_guidelines: templates/submission_guidelines.html

evaluation_script: evaluation_script.zip
remote_evaluation: False

start_date: 2025-07-01 00:00:00
end_date: 2025-12-31 23:59:59
published: True

tags: 
  - machine-learning
  - data-science
  - analogy-evaluation

leaderboard:
  - id: 1 
    schema:
      labels: ["Target Concept Coverage", "Mapping Strength", "Metaphoricity", "Overall Score Text"]
      default_order_by: "Overall Score Text"
      metadata:
        "Target Concept Coverage":
          sort_ascending: False 
          description: "How well the analogy covers the topics in the description."
        "Mapping Strength":
          sort_ascending: False
          description: "The logical soundness and consistency of the correspondence between source and target concepts."
        "Metaphoricity":
          sort_ascending: False 
          description: "Conceptual distance between the source and the target concept."
        "Overall Score Text": 
          sort_ascending: False 
          description: "Combined score for the text-only analogy evaluation."

  - id: 2 
    schema:
      labels: ["Target Concept Coverage", "Mapping Strength", "Metaphoricity", "Alignment with Text", "Visual Clarity", "Visual Engagement", "Overall Score Text+Video"]
      default_order_by: "Overall Score Text+Video"
      metadata:
        "Target Concept Coverage":
          sort_ascending: False
          description: "How well the analogy covers the topics in the description."
        "Mapping Strength":
          sort_ascending: False
          description: "The logical soundness and consistency of the correspondence between source and target concepts."
        "Metaphoricity":
          sort_ascending: False 
          description: "Conceptual distance between the source and the target concept."
        "Alignment with Text":
          sort_ascending: False
          description: "How completely and accurately the animation covers the content of the analogy text."
        "Visual Clarity":
          sort_ascending: False 
          description: "How clearly and accurately the visual elements represent the scene described in the analogy."
        "Visual Engagement":
          sort_ascending: False 
          description: "Rates how effectively the animation holds the viewer’s attention."
        "Overall Score Text+Video": 
          sort_ascending: False
          description: "Combined score for the text and video analogy evaluation."

challenge_phases:
  - id: 1 
    name: Text-only Analogy Evaluation
    description: templates/challenge_phase_1_description.html
    leaderboard_public: True 
    is_public: True
    is_active: True
    max_concurrent_submissions_allowed: 3
    allowed_email_ids: []
    disable_logs: False
    is_submission_public: True
    start_date: 2025-07-01 00:00:00
    end_date: 2025-12-31 23:59:59
    test_annotation_file: annotations/test_annotations_devsplit.json
    codename: text
    max_submissions_per_day: 5 
    max_submissions_per_month: 50
    max_submissions: 50
    default_submission_meta_attributes:
      - name: method_name
        is_visible: True
      - name: method_description
        is_visible: True
      - name: project_url
        is_visible: True
      - name: publication_url
        is_visible: True
    is_restricted_to_select_one_submission: False
    is_partial_submission_evaluation_enabled: False
    allowed_submission_file_types: ".json"

  - id: 2
    name: Text+Video Analogy Evaluation
    description: templates/challenge_phase_2_description.html
    leaderboard_public: True 
    is_public: True
    max_concurrent_submissions_allowed: 3
    allowed_email_ids: []
    disable_logs: False
    is_submission_public: True
    start_date: 2025-07-01 00:00:00
    end_date: 2025-12-31 23:59:59
    test_annotation_file: annotations/test_annotations_devsplit.json
    codename: textandvideo
    max_submissions_per_day: 5 
    max_submissions_per_month: 50
    max_submissions: 50
    default_submission_meta_attributes:
      - name: method_name
        is_visible: True
      - name: method_description
        is_visible: True
      - name: project_url
        is_visible: True
      - name: publication_url
        is_visible: True
    is_restricted_to_select_one_submission: False
    is_partial_submission_evaluation_enabled: False
    allowed_submission_file_types: ".json"

dataset_splits:
  - id: 1
    name: Test Split
    codename: test_split

challenge_phase_splits:
  - challenge_phase_id: 1
    leaderboard_id: 1
    dataset_split_id: 1
    visibility: 3
    leaderboard_decimal_precision: 2
    is_leaderboard_order_descending: True
    show_execution_time: True
    show_leaderboard_by_latest_submission: False
  - challenge_phase_id: 2
    leaderboard_id: 2
    dataset_split_id: 1
    visibility: 3
    leaderboard_decimal_precision: 2
    is_leaderboard_order_descending: True
    show_execution_time: False
    show_leaderboard_by_latest_submission: False
